[package]
name = "anime-levisione"
description = "A keyboard-first anime browser and player for your terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anime-levisione-core = { path = "../core", features = ["clap"] }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", features = ["json"] }

[lints]
workspace = true
