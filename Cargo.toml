[package]
name = "anime-levisione"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first anime browser and player for your terminal"
license = "GPL-3.0-only"
repository = "https://github.com/k33wee/anime-levisione"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
fs4 = "1.1.0"
futures-util = "0.3"
html-escape = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
regex = "1"
reqwest = { version = "0.13", features = ["cookies", "json", "form", "query", "gzip", "brotli"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util", "fs", "signal"] }
toml = "0.9"
unicode-normalization = "0.1"
unicode-width = "0.2"
url = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
unwrap_used = "warn"
