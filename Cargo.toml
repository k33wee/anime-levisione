[workspace]
resolver = "3"
members = ["crates/core", "crates/tui", "crates/bindgen"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/k33wee/anime-levisione"

[workspace.dependencies]
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util", "fs", "signal"] }
uniffi = "0.29"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = true
